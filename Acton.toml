[package]
name = "openFi"
description = "A TON blockchain project"
version = "0.1.0"
license = "MIT"

[toolchain]
acton = "trunk"

[contracts.dao]
display-name = "Dao"
src = "phosphate/contracts/dao/dao.tolk"
depends = []

[contracts.followers]
display-name = "Followers"
src = "phosphate/contracts/followers/followers.tolk"
depends = []

[contracts.fossFi]
display-name = "FossFi"
src = "phosphate/contracts/fossFi/fossFi.tolk"

[[contracts.fossFi.depends]]
name = "fossFiWallet"
kind = "embed_code"
function = "fiWalletCompiledCode"

[contracts.fossFiWallet]
display-name = "FossFiWallet"
src = "phosphate/contracts/fossFi/fossFiWallet.tolk"
depends = []

[contracts.lottery]
display-name = "Lottery"
src = "phosphate/contracts/lottery/lottery.tolk"
depends = []

[contracts.personal]
display-name = "Personal"
src = "phosphate/contracts/privateMinter/personal.tolk"
depends = []

[contracts.personalWallet]
display-name = "PersonalWallet"
src = "phosphate/contracts/privateMinter/personalWallet.tolk"
depends = []

[contracts.somebodyHelpMePlsBruhhh]
display-name = "SomebodyHelpMePlsBruhhh"
src = "phosphate/contracts/recovery/somebodyHelpMePlsBruhhh.tolk"
depends = []

[fmt]
width = 100
ignore = []

[import-mappings]
acton = ".acton"
contracts = "phosphate/contracts"
gen = "gen"
tests = "tests"
wrappers = "wrappers"
wrappers-ts = "wrappers-ts"
